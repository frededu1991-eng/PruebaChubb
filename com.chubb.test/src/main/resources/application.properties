server.port=8080
spring.application.name=TestApplication

# Habilitar la consola web de H2 para visualizar los datos en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de la base de datos en memoria (los datos se borran al reiniciar)
spring.datasource.url=jdbc:h2:mem:clientedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=12345

# Actualizar el esquema de la base de datos automáticamente según las entidades
spring.sql.init.mode=always
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Cambia la ruta para acceder a la interfaz gráfica de Swagger (Por defecto es /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# Cambia la ruta donde se genera el JSON de la especificación OpenAPI (Por defecto es /v3/api-docs)
springdoc.api-docs.path=/api-docs



