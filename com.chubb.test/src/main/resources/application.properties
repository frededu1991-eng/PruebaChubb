server.port=8080
spring.application.name=TestApplication

# Habilitar la consola web de H2 para visualizar los datos en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de la base de datos en memoria (los datos se borran al reiniciar)
spring.datasource.url=jdbc:h2:mem:clientedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Actualizar el esquema de la base de datos automáticamente según las entidades
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update



